<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻境冒險者 - 雲端線上版角色收集圖鑑</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 藝術字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700;900&family=Cinzel:wght=600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        display: ['Cinzel', 'serif'],
                    },
                    colors: {
                        anime: {
                            dark: '#0B0F19',
                            darker: '#060810',
                            card: '#131A2E',
                            accent: '#6366F1',
                            pink: '#EC4899',
                            gold: '#F59E0B',
                            teal: '#14B8A6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #060810;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }
        /* 卡片流光外框 hover 效果 */
        .glow-card {
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glow-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #6366F1, #EC4899, #14B8A6, #F59E0B);
            border-radius: 1.5rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .glow-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }
        .glow-card:hover::after {
            opacity: 1;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen">

    <!-- 頂部導航欄 -->
    <nav class="border-b border-gray-800 bg-anime-darker/80 backdrop-blur-md sticky top-0 z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-anime-accent to-anime-pink flex items-center justify-center shadow-lg shadow-anime-accent/30">
                    <i class="fa-solid fa-cloud-sun text-white text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="font-display font-black text-xl tracking-wider bg-gradient-to-r from-white via-indigo-200 to-anime-pink bg-clip-text text-transparent">CLOUD ARCHIVE</h1>
                    <p class="text-xs text-gray-400">雲端線上二次元圖鑑系統</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <!-- 連線狀態徽章與統計 -->
                <div class="bg-anime-card/80 px-4 py-2 rounded-xl border border-gray-800 text-xs flex gap-4 items-center">
                    <div class="flex items-center gap-1.5">
                        <span id="sync-status-dot" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
                        <span id="sync-status-text">連線中...</span>
                    </div>
                    <!-- 雲端總收集統計 -->
                    <div class="border-l border-gray-700 pl-4">總雲端收藏：<span id="stat-total" class="font-bold text-anime-accent text-sm">0</span></div>
                    <!-- 新增：SSR(6★) 雲端收藏統計 -->
                    <div class="border-l border-gray-700 pl-4">SSR(6★)：<span id="stat-ssr" class="font-bold text-anime-gold text-sm">0</span></div>
                </div>
                <button onclick="openAddModal()" class="flex-1 sm:flex-none bg-gradient-to-r from-anime-accent to-anime-pink hover:opacity-90 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2 transition-all active:scale-95 text-sm">
                    <i class="fa-solid fa-circle-plus"></i> 新增角色
                </button>
            </div>
        </div>
    </nav>

    <!-- 主體內容 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- 搜尋與高階過濾控制面板 -->
        <section class="bg-anime-card/60 border border-gray-800 rounded-2xl p-6 backdrop-blur-sm mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- 搜尋輸入框 -->
                <div class="md:col-span-2 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-500">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="search-input" oninput="filterCharacters()" placeholder="搜尋雲端角色名稱、稱號、標籤或故事..." class="w-full bg-anime-darker border border-gray-700 rounded-xl py-3 pl-10 pr-4 text-sm text-gray-200 focus:outline-none focus:border-anime-accent transition-colors">
                </div>
                <!-- 屬性元素篩選 -->
                <div>
                    <select id="filter-element" onchange="filterCharacters()" class="w-full bg-anime-darker border border-gray-700 rounded-xl py-3 px-4 text-sm text-gray-200 focus:outline-none focus:border-anime-accent transition-colors">
                        <option value="">所有屬性 (All Elements)</option>
                        <option value="火">🔥 火屬性 (Pyro)</option>
                        <option value="水">💧 水屬性 (Hydro)</option>
                        <option value="風">🍃 風屬性 (Anemo)</option>
                        <option value="雷">⚡ 雷屬性 (Electro)</option>
                        <option value="光">✨ 光屬性 (Light)</option>
                        <option value="暗">🔮 暗屬性 (Dark)</option>
                    </select>
                </div>
                <!-- 稀有度星等篩選 -->
                <div>
                    <select id="filter-rarity" onchange="filterCharacters()" class="w-full bg-anime-darker border border-gray-700 rounded-xl py-3 px-4 text-sm text-gray-200 focus:outline-none focus:border-anime-accent transition-colors">
                        <option value="">所有稀有度 (All Rarity)</option>
                        <option value="6">⭐⭐⭐⭐⭐⭐ (6星 - 神話)</option>
                        <option value="5">⭐⭐⭐⭐⭐ (5星 - 傳奇)</option>
                        <option value="4">⭐⭐⭐⭐ (4星 - 史詩)</option>
                        <option value="3">⭐⭐⭐ (3星 - 稀有)</option>
                    </select>
                </div>
            </div>

            <!-- 熱門標籤快速切換 -->
            <div class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-gray-800/60">
                <span class="text-xs text-gray-400 mr-2">快速篩選標籤:</span>
                <button onclick="filterByTag('')" id="btn-tag-all" class="tag-btn text-xs px-3 py-1 rounded-full bg-anime-accent text-white font-medium transition-all">全部</button>
                <div id="quick-tags" class="flex flex-wrap gap-2">
                    <!-- JS 動態生成標籤按鈕 -->
                </div>
            </div>
        </section>

        <!-- 角色卡牌展示區 -->
        <section>
            <!-- 雲端連線載入中 (骨架屏) -->
            <div id="cloud-loading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="bg-anime-card rounded-3xl h-[380px] animate-pulse border border-gray-800"></div>
                <div class="bg-anime-card rounded-3xl h-[380px] animate-pulse border border-gray-800"></div>
                <div class="bg-anime-card rounded-3xl h-[380px] animate-pulse border border-gray-800"></div>
                <div class="bg-anime-card rounded-3xl h-[380px] animate-pulse border border-gray-800"></div>
            </div>

            <!-- 查無資料時顯示 -->
            <div id="no-characters" class="hidden flex-col items-center justify-center py-20 text-center">
                <div class="w-24 h-24 rounded-full bg-gray-800/50 flex items-center justify-center text-gray-500 mb-4 text-3xl">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-300">雲端圖鑑尚未建立資料</h3>
                <p class="text-sm text-gray-500 mt-1">您可以點擊「新增角色」或立刻載入一組精美的推薦範例至雲端！</p>
                <button onclick="seedCloudDemoData()" class="mt-4 text-xs text-anime-accent hover:underline flex items-center gap-1 mx-auto bg-anime-accent/10 px-4 py-2 rounded-xl border border-anime-accent/30 hover:bg-anime-accent/20 transition-all">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 一鍵寫入官方範例至雲端庫
                </button>
            </div>

            <!-- 卡牌 Grid -->
            <div id="character-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
                <!-- 角色卡牌由 JS 動態生成 -->
            </div>
        </section>
    </main>

    <!-- 【新增 / 編輯 角色視窗】 -->
    <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-anime-card border border-gray-800 rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl relative">
            <!-- 關閉按鈕 -->
            <button onclick="closeAddModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white w-8 h-8 rounded-full bg-anime-darker flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="p-6 md:p-8">
                <h2 id="modal-title" class="text-xl font-bold bg-gradient-to-r from-anime-accent to-anime-pink bg-clip-text text-transparent mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 新增雲端角色
                </h2>

                <form id="char-form" onsubmit="saveCharacter(event)" class="space-y-6">
                    <input type="hidden" id="char-id">
                    
                    <!-- 基本資料欄位 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">角色名稱 *</label>
                            <input type="text" id="char-name" required placeholder="例如：緋紅之女皇 · 蕾娜" class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">稱號 / 職業設定</label>
                            <input type="text" id="char-title" placeholder="例如：深淵火之大導師" class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent">
                        </div>
                    </div>

                    <!-- 屬性與星等 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">屬性分類</label>
                            <select id="char-element" class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent">
                                <option value="火">🔥 火屬性 (Pyro)</option>
                                <option value="水">💧 水屬性 (Hydro)</option>
                                <option value="風">🍃 風屬性 (Anemo)</option>
                                <option value="雷">⚡ 雷屬性 (Electro)</option>
                                <option value="光">✨ 光屬性 (Light)</option>
                                <option value="暗">🔮 暗屬性 (Dark)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">稀有度星等</label>
                            <select id="char-rarity" class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent">
                                <option value="6">⭐⭐⭐⭐⭐⭐ (6星 - 神話)</option>
                                <option value="5">⭐⭐⭐⭐⭐ (5星 - 傳奇)</option>
                                <option value="4">⭐⭐⭐⭐ (4星 - 史詩)</option>
                                <option value="3">⭐⭐⭐ (3星 - 稀有)</option>
                            </select>
                        </div>
                    </div>

                    <!-- 圖片來源切換 -->
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">角色立繪來源 *</label>
                        <div class="flex bg-anime-darker p-1 rounded-xl gap-1 mb-3">
                            <button type="button" onclick="switchImageTab('ai')" id="tab-btn-ai" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-center text-white bg-anime-accent">
                                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI 召喚繪圖
                            </button>
                            <button type="button" onclick="switchImageTab('upload')" id="tab-btn-upload" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-center text-gray-400">
                                <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 本地上傳
                            </button>
                            <button type="button" onclick="switchImageTab('url')" id="tab-btn-url" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-center text-gray-400">
                                <i class="fa-solid fa-link mr-1"></i> 外部網址
                            </button>
                        </div>

                        <!-- Tab 1: AI Imagen 4 繪圖 -->
                        <div id="img-sec-ai" class="space-y-3 bg-anime-darker/50 p-4 rounded-xl border border-gray-800">
                            <div>
                                <label class="block text-[11px] text-gray-400 mb-1">二次元提示詞 Prompt (建議英文，生成品質更佳)</label>
                                <textarea id="ai-prompt" rows="2" placeholder="例如：1girl, silver hair, red battle armor, giant fire sword, dramatic lighting, detailed background" class="w-full bg-anime-darker border border-gray-700 rounded-lg p-2.5 text-xs text-gray-200 focus:outline-none focus:border-anime-accent"></textarea>
                            </div>
                            <button type="button" onclick="generateAIImage()" id="btn-generate-ai" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:opacity-90 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition-all">
                                <i class="fa-solid fa-sparkles"></i> 啟動魔法召喚 (AI 繪圖)
                            </button>
                        </div>

                        <!-- Tab 2: 本地圖片檔案上傳 -->
                        <div id="img-sec-upload" class="hidden space-y-3">
                            <div class="border-2 border-dashed border-gray-700 hover:border-anime-accent rounded-xl p-6 text-center cursor-pointer transition-colors relative" id="drop-zone">
                                <input type="file" id="file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
                                <i class="fa-solid fa-images text-3xl text-gray-500 mb-2"></i>
                                <p class="text-xs text-gray-400">點擊或拖曳立繪圖片到此處</p>
                                <p class="text-[10px] text-gray-500 mt-1">支援 PNG, JPG, WebP 格式</p>
                            </div>
                        </div>

                        <!-- Tab 3: 直接填寫 URL -->
                        <div id="img-sec-url" class="hidden space-y-3">
                            <input type="url" id="image-url-input" placeholder="請輸入可公開存取的圖片 URL 網址 (HTTPS)" oninput="updatePreviewFromUrl()" class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent">
                        </div>

                        <!-- 統一預覽區 -->
                        <div class="mt-4 flex flex-col items-center justify-center bg-anime-darker rounded-xl p-3 border border-gray-800 min-h-[180px] relative overflow-hidden">
                            <p id="preview-placeholder" class="text-xs text-gray-500">暫無圖片預覽</p>
                            <img id="image-preview" src="" class="max-h-[220px] rounded-lg shadow-md hidden object-cover">
                            <!-- 載入動畫 -->
                            <div id="ai-loading" class="hidden flex-col items-center justify-center gap-3 py-6">
                                <div class="w-10 h-10 border-4 border-anime-accent border-t-transparent rounded-full animate-spin"></div>
                                <p class="text-xs text-anime-accent font-medium animate-pulse">正在開啟召喚法陣繪製立繪 (約 5~10 秒)...</p>
                            </div>
                        </div>
                    </div>

                    <!-- 角色標籤 -->
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">角色標籤 (多個標籤請用半形逗號分隔)</label>
                        <input type="text" id="char-tags" placeholder="例如：法師, 銀髮, 傲嬌, 守護者" class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent">
                    </div>

                    <!-- 背景故事 -->
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1.5 uppercase tracking-wider">傳奇背景故事</label>
                        <textarea id="char-bio" rows="3" placeholder="編寫此冒險者的生平來歷、戰鬥技巧或性格..." class="w-full bg-anime-darker border border-gray-700 rounded-xl p-3 text-sm text-gray-200 focus:outline-none focus:border-anime-accent"></textarea>
                    </div>

                    <!-- 操作按鈕 -->
                    <div class="flex gap-4 pt-4 border-t border-gray-800">
                        <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-3 rounded-xl text-sm transition-all">
                            取消
                        </button>
                        <button type="submit" class="flex-1 bg-gradient-to-r from-anime-accent to-anime-pink hover:opacity-90 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/20">
                            寫入雲端圖鑑
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 【角色詳細資料展示彈窗】 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-anime-card border border-gray-800 rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl relative">
            <button onclick="closeDetailModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white w-8 h-8 rounded-full bg-anime-darker flex items-center justify-center z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="grid grid-cols-1 md:grid-cols-12">
                <!-- 左側：圖片高畫質展出 -->
                <div class="md:col-span-5 relative bg-black min-h-[350px] md:min-h-[500px] flex items-center justify-center overflow-hidden">
                    <img id="detail-img" src="" class="absolute inset-0 w-full h-full object-cover">
                    <!-- 屬性徽章 -->
                    <div id="detail-element-badge" class="absolute top-4 left-4 px-3 py-1.5 rounded-full text-xs font-black backdrop-blur-md border border-white/20 text-white flex items-center gap-1.5">
                        <!-- 系統自動渲染 -->
                    </div>
                </div>

                <!-- 右側：詳細故事與設定 -->
                <div class="md:col-span-7 p-6 md:p-8 flex flex-col justify-between">
                    <div>
                        <!-- 星等星級 -->
                        <div id="detail-stars" class="flex text-anime-gold gap-1 text-sm mb-2">
                            <!-- 系統自動渲染 -->
                        </div>
                        
                        <!-- 名字與稱號 -->
                        <h2 id="detail-name" class="text-2xl md:text-3xl font-black text-white mb-1">載入中...</h2>
                        <p id="detail-title" class="text-sm text-anime-accent font-medium mb-4">載入中...</p>
                        
                        <!-- 標籤組 -->
                        <div id="detail-tags" class="flex flex-wrap gap-1.5 mb-6">
                            <!-- 系統自動渲染 -->
                        </div>

                        <!-- 奢華漸層分割線 -->
                        <div class="h-[1px] bg-gradient-to-r from-gray-800 to-transparent mb-6"></div>

                        <!-- 故事本文 -->
                        <div class="space-y-3">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">冒險者傳記 (Biography)</h4>
                            <p id="detail-bio" class="text-sm text-gray-300 leading-relaxed max-h-[180px] overflow-y-auto pr-2">
                                正在讀取雲端卷軸故事中...
                            </p>
                        </div>
                    </div>

                    <!-- 功能按鈕 -->
                    <div class="flex gap-3 mt-8 pt-6 border-t border-gray-800/80">
                        <button id="btn-edit" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all">
                            <i class="fa-solid fa-pen-to-square"></i> 編輯雲端檔案
                        </button>
                        <button id="btn-delete" class="flex-1 bg-red-950/40 hover:bg-red-900/40 border border-red-800/60 text-red-400 py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all">
                            <i class="fa-solid fa-trash"></i> 遣返角色 (刪除)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頂部浮動訊息提示框 (Toast) -->
    <div id="toast" class="fixed bottom-6 right-6 bg-anime-dark border border-indigo-500/30 text-gray-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 transform translate-y-20 opacity-0 transition-all duration-300">
        <div class="w-6 h-6 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xs" id="toast-icon">
            <i class="fa-solid fa-info"></i>
        </div>
        <p id="toast-text" class="text-xs font-medium"></p>
    </div>

    <!-- Firebase 11.6.1 模塊 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 整合設定
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'anime-cloud-gallery';
        const apiKey = ""; // 運作時提供的安全 key

        // 全域核心狀態
        let characters = [];
        let currentImgTab = 'ai';
        let currentSelectedImg = '';
        let activeFilterTag = '';
        let currentUser = null;

        // 預設精緻角色立繪範本
        const demoCharacters = [
            {
                name: "星詠之巫女 · 神樂",
                title: "星穹神殿首席守護者",
                element: "光",
                rarity: "6",
                image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=600&auto=format&fit=crop",
                tags: ["巫女", "星空魔法", "限定", "御姐"],
                bio: "自小在星穹神殿長大的神樂，擁有讀懂星辰運作軌跡的不可思議能力。她手中的星曜法杖據說是用隕落的核心水晶打造而成，能在夜空中劃出美麗而致命的極光軌跡，治癒盟友的同時粉碎所有深淵魔物。"
            },
            {
                name: "燼火狂刃 · 亞修",
                title: "烈焰重劍傭兵團長",
                element: "火",
                rarity: "5",
                image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop",
                tags: ["戰士", "熱血", "重劍", "狂暴"],
                bio: "在最殘酷的熔岩火山地淬煉重劍長達十年，亞修只追求與強者的宿命對決。雖然外表狂妄粗獷，但內心卻恪守著傭兵獨特的榮耀。戰鬥時，重劍燃燒起的熊熊烈焰能將敵人的意志瞬間吞噬殆盡。"
            },
            {
                name: "深海潮汐 · 艾露亞",
                title: "幻海歌姬",
                element: "水",
                rarity: "5",
                image: "https://images.unsplash.com/photo-1560942485-b2a11cc13456?q=80&w=600&auto=format&fit=crop",
                tags: ["人魚", "療癒", "歌姬", "溫柔"],
                bio: "艾露亞的歌聲擁有平息暴風雨的深海魔力。她是海域的守護精靈，當迷途船隻遭遇滔天海難時，她溫柔的海洋旋律會為大家撥開重霧、指引歸途。在戰鬥中，她的高音能化作極為堅固的潮汐波瀾。"
            },
            {
                name: "迅影獵手 · 凱莉",
                title: "微風之息暗影刺客",
                element: "風",
                rarity: "4",
                image: "https://images.unsplash.com/photo-1580477667995-2b94f01c9516?q=80&w=600&auto=format&fit=crop",
                tags: ["刺客", "精靈", "雙刀", "高敏捷"],
                bio: "穿梭於無盡巨木森林中的風之妖精。凱莉行動時無聲無息，猶如拂過林梢的微風。她的雙手利刃能在瞬息之間刺出數千次，在敵人察覺到冰冷微風吹拂前，戰鬥便早已在風息中悄然落幕。"
            }
        ];

        // 初始化安全認證 (遵照 Rule 3: 優先進行認證)
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Firebase 認證失敗", err);
                showToast("❌ 雲端授權失敗，請確認配置！", "error");
            }
        };

        initAuth();

        // 監聽連線與授權狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                
                // 更新狀態 UI
                const dot = document.getElementById('sync-status-dot');
                const txt = document.getElementById('sync-status-text');
                dot.className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-lg shadow-green-500/50";
                txt.innerText = "雲端已連線";

                // 開始訂閱雲端資料庫 (遵照 Rule 1: 嚴格公用路徑規格)
                const charactersQuery = query(
                    collection(db, 'artifacts', appId, 'public', 'data', 'characters')
                );

                onSnapshot(charactersQuery, (snapshot) => {
                    const loadedData = [];
                    snapshot.forEach((doc) => {
                        loadedData.push({ id: doc.id, ...doc.data() });
                    });
                    
                    characters = loadedData;
                    
                    // 關閉骨架屏，顯現真實網格
                    document.getElementById('cloud-loading').classList.add('hidden');
                    document.getElementById('character-grid').classList.remove('hidden');

                    updateStats();
                    renderGallery();
                    renderTags();
                }, (error) => {
                    console.error("監聽雲端資料錯誤", error);
                    showToast("❌ 無法載入雲端數據，請檢查權限！", "error");
                });

            } else {
                currentUser = null;
            }
        });

        // 雲端資料庫範本寫入
        window.seedCloudDemoData = async function() {
            if (!currentUser) return;
            showToast("🌌 正在施法寫入初始次元範本至雲端庫...", "info");
            
            try {
                for (let char of demoCharacters) {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'characters'), char);
                }
                showToast("✨ 4位推薦冒險者已成功儲存至雲端！", "success");
            } catch (err) {
                console.error("寫入初始範本錯誤", err);
                showToast("❌ 寫入雲端失敗！", "error");
            }
        };

        // 渲染主畫面卡牌
        window.renderGallery = function() {
            const grid = document.getElementById('character-grid');
            const noChar = document.getElementById('no-characters');
            
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const filterEl = document.getElementById('filter-element').value;
            const filterRar = document.getElementById('filter-rarity').value;

            const filtered = characters.filter(char => {
                const matchesSearch = char.name.toLowerCase().includes(searchVal) || 
                                      (char.title && char.title.toLowerCase().includes(searchVal)) ||
                                      (char.bio && char.bio.toLowerCase().includes(searchVal)) ||
                                      char.tags.some(t => t.toLowerCase().includes(searchVal));
                
                const matchesElement = filterEl ? char.element === filterEl : true;
                const matchesRarity = filterRar ? char.rarity === filterRar : true;
                const matchesActiveTag = activeFilterTag ? char.tags.includes(activeFilterTag) : true;

                return matchesSearch && matchesElement && matchesRarity && matchesActiveTag;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noChar.classList.remove('hidden');
                noChar.classList.add('flex');
                return;
            } else {
                noChar.classList.remove('flex');
                noChar.classList.add('hidden');
            }

            grid.innerHTML = filtered.map(char => {
                const elColors = getElementStyle(char.element);
                const starsHtml = '⭐'.repeat(parseInt(char.rarity));

                return `
                    <div onclick="openDetailModal('${char.id}')" class="glow-card cursor-pointer bg-anime-card rounded-3xl overflow-hidden border border-gray-800 flex flex-col justify-between h-[380px] shadow-lg">
                        <div class="relative h-[220px] w-full overflow-hidden bg-anime-darker">
                            <img src="${char.image || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400'}" 
                                 alt="${char.name}" 
                                 onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400'"
                                 class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
                            
                            <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/10 text-[10px] px-2.5 py-1 rounded-full text-white font-bold flex items-center gap-1">
                                <span style="color: ${elColors.color}">${elColors.emoji}</span> ${char.element}
                            </div>

                            <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-lg text-[9px] text-anime-gold font-bold">
                                ${starsHtml}
                            </div>
                        </div>

                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-100 text-base line-clamp-1">${char.name}</h3>
                                <p class="text-xs text-anime-accent mt-0.5 line-clamp-1">${char.title || '次元時空的流浪者'}</p>
                            </div>
                            
                            <div class="flex flex-wrap gap-1 mt-2 overflow-hidden h-[24px]">
                                ${char.tags.slice(0, 3).map(tag => `<span class="bg-anime-darker border border-gray-800 text-[9px] text-gray-400 px-2 py-0.5 rounded-md">#${tag}</span>`).join('')}
                                ${char.tags.length > 3 ? `<span class="text-[9px] text-gray-500 self-center">+${char.tags.length - 3}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        function getElementStyle(element) {
            switch(element) {
                case '火': return { emoji: '🔥', color: '#EF4444' };
                case '水': return { emoji: '💧', color: '#3B82F6' };
                case '風': return { emoji: '🍃', color: '#10B981' };
                case '雷': return { emoji: '⚡', color: '#A855F7' };
                case '光': return { emoji: '✨', color: '#F59E0B' };
                case '暗': return { emoji: '🔮', color: '#EC4899' };
                default: return { emoji: '🌌', color: '#6366F1' };
            }
        }

        // 修改：加入安全防護（Null Check），以確保找不到 DOM 元素時不報錯
        function updateStats() {
            const totalEl = document.getElementById('stat-total');
            if (totalEl) {
                totalEl.innerText = characters.length;
            }
            
            const ssrCount = characters.filter(c => c.rarity === "6").length;
            const ssrEl = document.getElementById('stat-ssr');
            if (ssrEl) {
                ssrEl.innerText = ssrCount;
            }
        }

        window.renderTags = function() {
            const allTagsSet = new Set();
            characters.forEach(c => c.tags.forEach(t => { if(t.trim()) allTagsSet.add(t.trim()); }));
            
            const container = document.getElementById('quick-tags');
            container.innerHTML = Array.from(allTagsSet).slice(0, 15).map(tag => {
                const isActive = activeFilterTag === tag;
                return `
                    <button onclick="filterByTag('${tag}')" class="tag-btn text-xs px-3 py-1 rounded-full border transition-all ${
                        isActive 
                        ? 'bg-anime-accent/20 border-anime-accent text-anime-accent font-medium' 
                        : 'bg-anime-darker border-gray-800 text-gray-400 hover:border-gray-700'
                    }">${tag}</button>
                `;
            }).join('');
        };

        window.filterCharacters = function() {
            renderGallery();
        };

        window.filterByTag = function(tag) {
            activeFilterTag = tag;
            const btnAll = document.getElementById('btn-tag-all');
            if (tag === '') {
                btnAll.className = "tag-btn text-xs px-3 py-1 rounded-full bg-anime-accent text-white font-medium transition-all";
            } else {
                btnAll.className = "tag-btn text-xs px-3 py-1 rounded-full bg-anime-darker border border-gray-800 text-gray-400 hover:border-gray-700 transition-all";
            }
            renderTags();
            renderGallery();
        };

        // 編輯彈窗控制
        window.openAddModal = function(charId = null) {
            const modal = document.getElementById('add-modal');
            const title = document.getElementById('modal-title');
            
            document.getElementById('char-form').reset();
            document.getElementById('char-id').value = '';
            document.getElementById('image-preview').src = '';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('preview-placeholder').classList.remove('hidden');
            currentSelectedImg = '';
            switchImageTab('ai');

            if (charId) {
                title.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 編輯雲端檔案`;
                const char = characters.find(c => c.id === charId);
                if (char) {
                    document.getElementById('char-id').value = char.id;
                    document.getElementById('char-name').value = char.name;
                    document.getElementById('char-title').value = char.title || '';
                    document.getElementById('char-element').value = char.element;
                    document.getElementById('char-rarity').value = char.rarity;
                    document.getElementById('char-tags').value = char.tags.join(', ');
                    document.getElementById('char-bio').value = char.bio || '';
                    
                    if (char.image) {
                        currentSelectedImg = char.image;
                        document.getElementById('image-preview').src = char.image;
                        document.getElementById('image-preview').classList.remove('hidden');
                        document.getElementById('preview-placeholder').classList.add('hidden');
                        
                        if (char.image.startsWith('data:image')) {
                            switchImageTab('upload');
                        } else {
                            switchImageTab('url');
                            document.getElementById('image-url-input').value = char.image;
                        }
                    }
                }
            } else {
                title.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> 新增雲端角色`;
            }

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        window.switchImageTab = function(tab) {
            currentImgTab = tab;
            const btnAi = document.getElementById('tab-btn-ai');
            const btnUpload = document.getElementById('tab-btn-upload');
            const btnUrl = document.getElementById('tab-btn-url');

            const secAi = document.getElementById('img-sec-ai');
            const secUpload = document.getElementById('img-sec-upload');
            const secUrl = document.getElementById('img-sec-url');

            [btnAi, btnUpload, btnUrl].forEach(btn => {
                btn.classList.remove('bg-anime-accent', 'text-white');
                btn.classList.add('text-gray-400');
            });

            secAi.classList.add('hidden');
            secUpload.classList.add('hidden');
            secUrl.classList.add('hidden');

            if (tab === 'ai') {
                btnAi.classList.add('bg-anime-accent', 'text-white');
                secAi.classList.remove('hidden');
            } else if (tab === 'upload') {
                btnUpload.classList.add('bg-anime-accent', 'text-white');
                secUpload.classList.remove('hidden');
            } else if (tab === 'url') {
                btnUrl.classList.add('bg-anime-accent', 'text-white');
                secUrl.classList.remove('hidden');
            }
        };

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentSelectedImg = e.target.result;
                const previewImg = document.getElementById('image-preview');
                previewImg.src = currentSelectedImg;
                previewImg.classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.updatePreviewFromUrl = function() {
            const url = document.getElementById('image-url-input').value.trim();
            const previewImg = document.getElementById('image-preview');
            
            if (url) {
                currentSelectedImg = url;
                previewImg.src = url;
                previewImg.classList.remove('hidden');
                document.getElementById('preview-placeholder').classList.add('hidden');
            } else {
                previewImg.classList.add('hidden');
                document.getElementById('preview-placeholder').classList.remove('hidden');
            }
        };

        // 【AI Imagen 4 繪圖引擎】
        window.generateAIImage = async function() {
            const promptInput = document.getElementById('ai-prompt').value.trim();
            if (!promptInput) {
                showToast("⚠️ 請先輸入生成立繪的提示詞！", "warning");
                return;
            }

            const btn = document.getElementById('btn-generate-ai');
            const loading = document.getElementById('ai-loading');
            const previewImg = document.getElementById('image-preview');
            const placeholder = document.getElementById('preview-placeholder');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            previewImg.classList.add('hidden');
            placeholder.classList.add('hidden');

            const animeRefinedPrompt = `highly detailed anime key visual, solo character portrait, ${promptInput}, masterpiece, dynamic lighting, perfect anime faces, vivid colors`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            const payload = {
                instances: { prompt: animeRefinedPrompt },
                parameters: { sampleCount: 1 }
            };

            let retries = 5;
            let delay = 1000;
            let success = false;

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`API 伺服器錯誤: ${response.status}`);
                    
                    const result = await response.json();
                    const base64Data = result.predictions?.[0]?.bytesBase64Encoded;
                    
                    if (base64Data) {
                        currentSelectedImg = `data:image/png;base64,${base64Data}`;
                        previewImg.src = currentSelectedImg;
                        previewImg.classList.remove('hidden');
                        showToast("✨ 召喚完成！AI 立繪成功存入預覽。", "success");
                        success = true;
                        break;
                    } else {
                        throw new Error("回應不符合預期");
                    }
                } catch (err) {
                    console.warn(`第 ${i + 1} 次召喚失敗，正於 ${delay}ms 後重試...`);
                    if (i === retries - 1) {
                        showToast("❌ 召喚術失敗！請確認提示詞內容並重新嘗試。", "error");
                        placeholder.classList.remove('hidden');
                    } else {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    }
                }
            }

            btn.disabled = false;
            btn.classList.remove('opacity-50');
            loading.classList.add('hidden');
        };

        // 【同步至 Firestore 雲端資料庫】
        window.saveCharacter = async function(event) {
            event.preventDefault();

            if (!currentUser) {
                showToast("⚠️ 雲端尚未認證完成，請稍候重試", "warning");
                return;
            }

            const charId = document.getElementById('char-id').value;
            const name = document.getElementById('char-name').value.trim();
            const title = document.getElementById('char-title').value.trim();
            const element = document.getElementById('char-element').value;
            const rarity = document.getElementById('char-rarity').value;
            const bio = document.getElementById('char-bio').value.trim();
            
            const tagsInput = document.getElementById('char-tags').value;
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t !== '') : [];

            if (!currentSelectedImg) {
                showToast("⚠️ 請為此角色設定立繪！（可使用 AI 召喚、上傳檔案或外部連結）", "warning");
                return;
            }

            showToast("🌐 正在儲存至雲端...", "info");

            const charData = {
                name,
                title,
                element,
                rarity,
                image: currentSelectedImg,
                tags,
                bio
            };

            try {
                if (charId) {
                    // 更新 (Rule 1 規格路徑)
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'characters', charId);
                    await updateDoc(docRef, charData);
                    showToast(`📝 冒險者「${name}」已在雲端同步更新！`, "success");
                } else {
                    // 新建 (Rule 1 規格路徑)
                    const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'characters');
                    await addDoc(collectionRef, charData);
                    showToast(`🎉 成功將「${name}」召喚寫入雲端！`, "success");
                }
                closeAddModal();
            } catch (err) {
                console.error("雲端存檔失敗", err);
                showToast("❌ 寫入雲端發生錯誤，請確認設定！", "error");
            }
        };

        // 詳細面板
        window.openDetailModal = function(charId) {
            const char = characters.find(c => c.id === charId);
            if (!char) return;

            document.getElementById('detail-name').innerText = char.name;
            document.getElementById('detail-title').innerText = char.title || '次元時空的流浪者';
            document.getElementById('detail-bio').innerText = char.bio || '這位冒險者還沒有留下任何輝煌的故事。您可以編寫並傳承他的冒險事蹟！';
            
            const detailImg = document.getElementById('detail-img');
            detailImg.src = char.image || '';
            detailImg.onerror = function() {
                this.src = 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600';
            };

            document.getElementById('detail-stars').innerHTML = '★'.repeat(parseInt(char.rarity));

            const elStyle = getElementStyle(char.element);
            const badge = document.getElementById('detail-element-badge');
            badge.innerHTML = `<span>${elStyle.emoji}</span> ${char.element}屬性`;
            badge.style.backgroundColor = elStyle.color + '25'; 
            badge.style.borderColor = elStyle.color + '88';

            const tagsContainer = document.getElementById('detail-tags');
            if (char.tags.length > 0) {
                tagsContainer.innerHTML = char.tags.map(tag => `
                    <span class="bg-anime-darker border border-gray-800 text-xs text-gray-300 px-3 py-1 rounded-full"># ${tag}</span>
                `).join('');
            } else {
                tagsContainer.innerHTML = `<span class="text-xs text-gray-500">無特殊標籤</span>`;
            }

            document.getElementById('btn-edit').onclick = function() {
                closeDetailModal();
                openAddModal(char.id);
            };

            document.getElementById('btn-delete').onclick = function() {
                deleteCharacter(char.id, char.name);
            };

            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
            document.body.style.overflow = '';
        };

        // 雲端刪除
        window.deleteCharacter = async function(charId, name) {
            if (confirm(`您確定要將冒險者「${name}」從本圖鑑中遣返嗎？此動作將永久移除其雲端資料。`)) {
                showToast("🗑️ 正在從雲端卸載...", "info");
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'characters', charId);
                    await deleteDoc(docRef);
                    closeDetailModal();
                    showToast(`🗑️ 已成功自雲端卸載冒險者「${name}」。`, "info");
                } catch (err) {
                    console.error("雲端刪除失敗", err);
                    showToast("❌ 雲端刪除發生錯誤！", "error");
                }
            }
        };

        // 浮動提示 Toast
        window.showToast = function(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');

            toastText.innerText = message;

            if (type === "success") {
                toast.className = "fixed bottom-6 right-6 bg-anime-dark border border-green-500/30 text-green-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 transform transition-all duration-300";
                toastIcon.innerHTML = `<i class="fa-solid fa-circle-check text-green-400 text-sm"></i>`;
            } else if (type === "error") {
                toast.className = "fixed bottom-6 right-6 bg-anime-dark border border-red-500/30 text-red-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 transform transition-all duration-300";
                toastIcon.innerHTML = `<i class="fa-solid fa-circle-exclamation text-red-400 text-sm"></i>`;
            } else if (type === "warning") {
                toast.className = "fixed bottom-6 right-6 bg-anime-dark border border-yellow-500/30 text-yellow-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 transform transition-all duration-300";
                toastIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-yellow-400 text-sm"></i>`;
            } else {
                toast.className = "fixed bottom-6 right-6 bg-anime-dark border border-indigo-500/30 text-gray-200 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 transform transition-all duration-300";
                toastIcon.innerHTML = `<i class="fa-solid fa-info text-indigo-400 text-sm"></i>`;
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3500);
        };
    </script>
</body>
</html>
